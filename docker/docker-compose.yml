version: "3.9"

# Local-only services. Nothing here talks to the cloud, so this costs $0
# forever regardless of how long it runs. Start with: docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: financial_rag_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: financial_rag
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data:
